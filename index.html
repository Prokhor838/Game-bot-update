<style>

.tb{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;min-height:110px;padding:10px 4px}.pr{position:relative;width:76px;height:98px}.pr .pk{position:absolute;left:0;top:0}.pr .pk+.pk{left:18px;top:14px}
.gh2{position:fixed;pointer-events:none;z-index:30;display:grid;opacity:.9}.bx.pv{background:rgba(34,211,238,.6)!important}.bx.bad{background:rgba(244,63,94,.45)!important}.pc{touch-action:none;user-select:none}
@keyframes dr{0%{transform:translateY(-70px) scale(.5) rotate(-25deg);opacity:0}70%{transform:translateY(6px) scale(1.1)}}
.rw{display:flex;gap:10px;align-items:center}.ico{width:54px;height:54px;flex:none}
.it{display:flex;flex-direction:column;align-items:center;text-align:center;border-radius:16px;padding:10px 6px;background:var(--sf);border:2px solid var(--rc);font-size:12px}.it svg{width:52px}
.mo{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}.md{background:var(--bg2);color:var(--tx);border:1px solid var(--bd);border-radius:22px;padding:18px;max-width:420px;width:100%;max-height:85vh;overflow:auto}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:var(--ac);color:#fff;padding:10px 16px;border-radius:14px;font-weight:700;z-index:20;animation:in .2s;max-width:90%}
.bx{aspect-ratio:1;border-radius:6px;background:var(--sf);border:1px solid var(--bd)}.bx.f{border-color:#fff4;animation:pop .2s}
.pc{display:grid;gap:2px;padding:8px;border-radius:12px;border:2px solid transparent;background:var(--sf);cursor:pointer;min-width:60px;justify-items:center}.pc.on{border-color:var(--ac2)}
.sw{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
</style></head><body><div id="app"></div><div id="mo" class="mo" onclick="if(event.target==this)modal()"></div>
<script>
const $=s=>document.querySelector(s),shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const D={v:1,coins:500,theme:matchMedia('(prefers-color-scheme: light)').matches?'light':'dark',anim:true,daily:'',st:{g:0,w:0,l:0,lines:0,best:0,quiz:0,cases:0},col:{},ach:{}};
function load(){try{const r=JSON.parse(localStorage.getItem('gb2'));if(r&&r.v===1&&Number.isFinite(r.coins)&&r.coins>=0)return{...D,...r,st:{...D.st,...r.st},col:r.col||{},ach:r.ach||{}}}catch(e){}return JSON.parse(JSON.stringify(D))}
let S=load(),tab='home',game=null,G={},busy=false,tok=0,F={r:-1,s:'r'};
function save(){try{localStorage.setItem('gb2p',JSON.stringify({theme:S.theme,anim:S.anim}))}catch(e){}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),rid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2);
async function api(path,body,rd){try{const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-Init-Data':tg&&tg.initData||''},body:body?JSON.stringify({...body,rid:rd||rid()}):undefined});const d=await r.json();if(!r.ok){toast(d.error||'Ошибка сервера');return null}return d}catch(e){toast('Нет связи с сервером');return null}}
function apply(d){if(!d)return;if(d.me){const m=d.me;Object.assign(S,{id:m.id,coins:m.coins,col:m.col,st:m.st,ach:m.ach,daily:m.daily,today:m.day,next:m.next,admin:m.admin,ready:true});m.prices.forEach((p,i)=>ITEMS[i][3]=p)}(d.newAch||[]).forEach(i=>toast('Достижение: '+AC[i][0]+' +50'))}
async function rw(kind,arg){const d=await api('/api/reward',{kind,arg});if(d){apply(d);if(d.gain)toast('+'+d.gain+' монет');render()}}
async function boot(){try{Object.assign(S,JSON.parse(localStorage.getItem('gb2p')||'{}'))}catch(e){}render();
 if(!(tg&&tg.initData)){S.err='Откройте приложение через Telegram-бота';render();return}
 const d=await api('/api/me');if(d){apply(d)}else S.err='Не удалось подключиться к серверу. Закройте и откройте приложение снова';render()}
async function impDo(){modal();let o;try{o=JSON.parse(localStorage.getItem('gb2'))}catch(e){}const d=await api('/api/import',{data:o});if(d){apply(d);toast('Импортировано монет: '+d.imported)}render()}
function impAsk(){let o;try{o=JSON.parse(localStorage.getItem('gb2'))}catch(e){}if(!o||typeof o!=='object'){toast('Старых данных на этом адресе нет (хранилище браузера привязано к адресу сайта)');return}
 modal('<h3>Импорт старого прогресса</h3><p class=mu>Один раз. Будет добавлено: до 1000 монет, до 5 штук каждого кристалла, ограниченная статистика. Данные берутся с этого устройства и не проверяются сервером, поэтому лимиты жёсткие.</p><button class=btn onclick=impDo()>Импортировать</button><br><br><button class="btn g" onclick=modal()>Отмена</button>')}
const tg=window.Telegram&&Telegram.WebApp,TU=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user,NAME=TU&&TU.first_name||'Игрок';
if(tg){try{tg.ready();tg.expand()}catch(e){}}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2200)}
function modal(h){const m=$('#mo');m.innerHTML=h?`<div class=md>${h}</div>`:'';m.style.display=h?'flex':'none'}
function rec(){}
const RAR=['Обычный','Необычный','Редкий','Эпический','Легендарный'],RC=['#8a96b0','#34d399','#38bdf8','#a78bfa','#fbbf24'];
const ITEMS=[['Дымчатый кварц','Мутный камень из старых шахт',0,20,'#94a3b8'],['Янтарная друза','Хранит тепло рассвета',0,35,'#f59e0b'],['Изумрудный осколок','Зелёный свет глубин',1,60,'#10b981'],['Топаз ветров','Звенит на сквозняке',1,90,'#fb923c'],['Сапфировая призма','Холодное синее сияние',2,150,'#3b82f6'],['Рубиновое сердце','Пульсирует алым',2,220,'#ef4444'],['Аметист бури','Грозовая фиолетовая грань',3,400,'#a855f7'],['Бирюзовый Рассвет','Светится в темноте',3,550,'#14b8a6'],['Звёздный алмаз','Родился в туманности',4,1200,'#e0f2fe'],['Кристалл вечности','Меняет цвет с каждым взглядом',4,2000,'#f472b6']];
const icon=i=>{const c=ITEMS[i][4],v=i%3,p=v==0?'20,2 33,14 28,38 12,38 7,14':v==1?'20,2 36,20 20,38 4,20':'12,4 28,4 36,18 20,38 4,18',q=p.split(' ');return`<svg viewBox="0 0 40 40" style="filter:drop-shadow(0 0 6px ${c})"><defs><linearGradient id="g${i}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="${c}"/><stop offset="1" stop-color="${c}" stop-opacity=".6"/></linearGradient></defs><polygon points="${p}" fill="url(#g${i})" stroke="#fff" stroke-opacity=".7"/><polygon points="${q[0]} 20,20 ${q[1]}" fill="#fff" opacity=".35"/><circle cx="14" cy="12" r="2" fill="#fff" opacity=".8"/></svg>`};
const AC=[['Первая партия',()=>S.st.g>=1],['Первая победа',()=>S.st.w>=1],['Первый кейс',()=>S.st.cases>=1],['10 партий',()=>S.st.g>=10],['100 линий в «Блоках»',()=>S.st.lines>=100],['Викторина завершена',()=>S.st.quiz>=1],['Редкий предмет',()=>Object.keys(S.col).some(k=>ITEMS[k][2]>=2)],['Легендарный предмет',()=>Object.keys(S.col).some(k=>ITEMS[k][2]==4)]];
function ach(){}
const today=()=>S.today;
function left(){const s=Math.max(0,Math.floor((S.next-Date.now())/1000));return Math.floor(s/3600)+' ч '+Math.floor(s%3600/60)+' мин'}
async function claim(){if(busy)return;busy=true;const d=await api('/api/daily',{});busy=false;if(d){apply(d);toast('+100 монет')}render()}
// ---------- Games ----------
const WL=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]],win=b=>WL.find(l=>b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[1]]===b[l[2]]);
const T={init(){G={b:Array(9).fill(''),end:0,line:[]}},
tap(i){if(G.end||G.b[i])return;G.b[i]='X';if(!T.fin()){T.bot();T.fin()}render()},
bot(){const b=G.b,e=b.map((v,i)=>v?-1:i).filter(i=>i>=0),f=p=>e.find(i=>{b[i]=p;const w=win(b);b[i]='';return w});let m=f('O');if(m==null)m=f('X');if(m==null&&!b[4])m=4;if(m==null){const c=e.filter(i=>[0,2,6,8].includes(i)),a=c.length?c:e;m=a[Math.random()*a.length|0]}b[m]='O'},
fin(){const l=win(G.b);if(l){G.line=l;G.end=G.b[l[0]]=='X'?1:2}else if(G.b.every(x=>x))G.end=3;if(!G.end)return 0;rw('ttt',G.end);return 1},
view(){return bar('Крестики-нолики')+`<div class="bd t3">${G.b.map((v,i)=>`<button class="cell ${v} ${G.line.includes(i)?'w':''}" onclick="T.tap(${i})"><span>${v=='X'?'✕':v=='O'?'◯':''}</span></button>`).join('')}</div>`+(G.end?`<div class=card><div class=big>${['','Победа! +20','Поражение','Ничья +5'][G.end]}</div><button class=btn onclick="openG('ttt')">Играть снова</button><br><br><button class="btn g" onclick="exitG()">В меню</button></div>`:'<p class="mu" style="text-align:center">Ваш ход (✕). Победа +20, ничья +5</p>')}};
const SY=['🍒','🍋','🔔','💎','7️⃣'],SW=[5,4,3,2,1],SM=[4,6,10,20,50];let spinning=false;
const Z={init(){G={bet:10,r:[0,1,2],hist:[],msg:'Три одинаковых — множитель, две — возврат ставки'}},
async go(){if(spinning)return;spinning=true;const g=G,bet=g.bet;g.msg='';const t=setInterval(()=>{g.r=g.r.map(()=>Math.random()*5|0);if(game=='slots')render()},90);
const[d]=await Promise.all([api('/api/slots',{bet}),new Promise(r=>setTimeout(r,1100))]);clearInterval(t);spinning=false;if(!d){if(game=='slots')render();return}
apply(d);g.r=d.res;g.msg=d.pay>bet?`Выигрыш +${d.pay-bet}!`:d.pay==bet?'Ставка возвращена':'Не повезло';g.hist.unshift(d.pay-bet);g.hist=g.hist.slice(0,8);if(game=='slots')render()},
view(){return bar('Мини казино')+`<div class=card><div class=reels>${G.r.map(i=>`<div class=rl>${SY[i]}</div>`).join('')}</div><div class=big>${G.msg}</div><div class=chips>${[10,50,100].map(b=>`<button class="chip ${G.bet==b?'on':''}" onclick="if(!spinning){G.bet=${b};render()}">${b}</button>`).join('')}</div><button class=btn ${spinning?'disabled':''} onclick="Z.go()">Крутить за ${G.bet}</button></div><div class=card><b>Выплаты</b><div class=mu>${SY.map((s,i)=>s+s+s+' ×'+SM[i]).join(' · ')}<br>Любая пара — возврат ставки</div><p class=mu>Последние: ${G.hist.map(h=>h>0?'+'+h:h).join(', ')||'—'}</p></div>`}};
const LV=[['Лёгкий',50,7,30],['Средний',100,8,60],['Сложный',500,10,150]];
const N={init(){G={l:null}},start(l){G={l,n:1+Math.random()*LV[l][1]|0,t:0,hint:'Введите число',over:0,hist:[]};render()},
try(){if(G.over)return;const v=$('#gi').value.trim(),x=+v,[,m,a,r]=LV[G.l];if(!/^\d+$/.test(v)||x<1||x>m){toast('Введите целое число от 1 до '+m);return}G.t++;G.hist.push(x);if(x==G.n){G.over=1;rw('guess',{l:G.l,w:1,t:G.t})}else if(G.t>=a){G.over=2;rw('guess',{l:G.l,w:0,t:G.t})}else G.hint=x<G.n?'Больше ⬆':'Меньше ⬇';render()},

else if(A.sub=='prices')h+=ITEMS.map((x,i)=>`<div class=card style="margin:6px 0;cursor:pointer" onclick="ADM.price(${i})"><b style="color:${RC[x[2]]}">${x[0]}</b> <span class=mu>${RAR[x[2]]}</span><div class=mu>Цена: ${x[3]} монет · нажмите, чтобы изменить</div></div>`).join('');
else{const t=A.st;h+=(t?`<div class=card>Пользователей: <b>${t.users}</b><br>Монет в обороте: <b>${t.coins}</b><br>Кристаллов в коллекциях: <b>${t.crystals}</b><br>Выдано админом: <b>${t.given}</b> · изъято: <b>${t.taken}</b><br>Операций админа: <b>${t.ops}</b> (отклонено: ${t.rejected})<br><span class=mu>Резервные копии: ${t.backups.length?t.backups.join(', '):'нет'}</span></div>`:'')+A.lg.map(l=>`<div class=card style="margin:6px 0;font-size:12px">${esc(l.ts)} UTC<br>адм ${l.admin_id} → ${l.user_id??'—'} · ${esc(l.type)} · ${l.amount??''}<br>${esc(l.result)}</div>`).join('')}
return h},
opts(r){return ITEMS.map((x,i)=>[x,i]).filter(([x])=>r<0||x[2]==r).map(([x,i])=>`<option value=${i}>${x[0]} (${RAR[x[2]]}, ${x[3]})</option>`).join('')},
fl(){$('#ai').innerHTML=ADM.opts(+$('#ar').value)},
ask(op){const u=ADM.A.u,k=op[0]=='k';ADM.rid=rid();modal(`<h3>${LB[op]}</h3><p class=mu>Пользователь ${u.id} ${esc(u.username)}${u.id==S.id?' (вы)':''}</p>${k?`<select id=ar class=in style="font-size:16px;min-height:44px" onchange="ADM.fl()"><option value=-1>Любая редкость</option>${RAR.map((r,i)=>`<option value=${i}>${r}</option>`).join('')}</select><select id=ai class=in style="font-size:16px;min-height:44px">${ADM.opts(-1)}</select>`:''}<input id=an class=in inputmode=numeric placeholder="${k?'Количество':'Сумма'}"><button class=btn onclick="ADM.go('${op}')">Подтвердить</button><br><br><button class="btn g" onclick=modal()>Отмена</button>`)},
async go(op){const u=ADM.A.u,n=Number($('#an').value);if(!Number.isInteger(n)||n<(op=='ms'?0:1)){toast('Введите целое число');return}
const k=op[0]=='k',b=k?{uid:u.id,op:op=='kg'?'give':'take',item:+$('#ai').value,qty:n}:{uid:u.id,op:{mg:'give',mt:'take',ms:'set'}[op],amount:n},rd=ADM.rid;modal();
const d=await api(k?'/api/admin/crystals':'/api/admin/coins',b,rd);if(d){ADM.A.u=d.user;toast(d.result);if(d.user.id==S.id)apply(await api('/api/me'))}render()},
price(i){ADM.rid=rid();modal(`<h3>${ITEMS[i][0]}</h3><p class=mu>Текущая цена: ${ITEMS[i][3]}. Новая цена применяется к следующим продажам.</p><input id=an class=in inputmode=numeric placeholder="Цена в монетах"><button class=btn onclick="ADM.setp(${i})">Подтвердить</button><br><br><button class="btn g" onclick=modal()>Отмена</button>`)},
async setp(i){const n=Number($('#an').value);if(!Number.isInteger(n)||n<0){toast('Введите целое число');return}const rd=ADM.rid;modal();const d=await api('/api/admin/price',{item:i,price:n},rd);if(d){d.prices.forEach((p,j)=>ITEMS[j][3]=p);toast(d.result)}render()}};
SCR.admin=()=>ADM.view();
boot();
</script></body></html>
